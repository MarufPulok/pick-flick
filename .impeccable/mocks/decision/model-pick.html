<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Pick Flick - Dashboard</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wdth,wght@12..96,75..100,200..800&family=Geist:wght@400;500;600&family=Geist+Mono&display=swap" rel="stylesheet">
<style>
  html,body{margin:0;width:1440px;height:900px;overflow:hidden}
  body{
    position:relative;color:#ece5d5;font:400 16px/1.4 "Geist",system-ui,sans-serif;
    background:
      linear-gradient(90deg,rgba(23,21,15,.88) 0,rgba(23,21,15,.88) 55%,rgba(23,21,15,.15) 100%),
      linear-gradient(135deg,#3b2f22 0%,#1f1a14 50%,#17150f 100%);
    background-color:#17150f;
  }
  .wrap{position:absolute;left:60px;width:1320px}
  header{top:0;height:64px;display:flex;align-items:center;justify-content:space-between}
  .logo{font:700 20px "Bricolage Grotesque",sans-serif}
  nav{display:flex;align-items:center;gap:32px;font-size:15px}
  nav a{opacity:.75;color:inherit;text-decoration:none}
  .avatar{width:32px;height:32px;border-radius:50%;background:#4a3a2a;border:1px solid rgba(236,229,213,.14)}
  main{top:120px;width:620px}
  input{
    box-sizing:border-box;width:620px;height:48px;padding:0 16px;border-radius:8px;
    background:transparent;border:1px solid rgba(236,229,213,.14);color:#ece5d5;font:inherit;outline:none;
  }
  input::placeholder{color:#9a927f}
  input:focus{border-color:#e8a33a;box-shadow:0 0 0 3px rgba(232,163,58,.35)}
  .chips{display:flex;flex-wrap:wrap;gap:8px;margin-top:16px}
  .chip{
    height:36px;padding:0 16px;border-radius:999px;background:transparent;color:#ece5d5;
    border:1px solid rgba(236,229,213,.14);font:400 14px "Geist",sans-serif;cursor:pointer;
  }
  .chip.on{background:#e8a33a;border-color:#e8a33a;color:#17150f;font-weight:500}
  h1{
    margin:56px 0 0;font:600 88px/.95 "Bricolage Grotesque",sans-serif;
    font-stretch:100%;letter-spacing:-.02em;
  }
  .meta{margin:20px 0 0;font:400 14px "Geist Mono",ui-monospace,monospace;color:#9a927f}
  .reason{margin:20px 0 0;max-width:520px;font-size:20px;line-height:1.5}
  .actions{display:flex;gap:12px;margin-top:32px}
  .btn{
    width:160px;height:52px;border-radius:8px;font:600 16px "Geist",sans-serif;cursor:pointer;
    border:1px solid rgba(236,229,213,.14);background:transparent;color:#ece5d5;
  }
  .btn.play{background:#e8a33a;border-color:#e8a33a;color:#17150f}
  .tools{display:flex;gap:12px;margin-top:24px}
  .tools i{width:36px;height:36px;box-sizing:border-box;border-radius:50%;border:1px solid rgba(236,229,213,.14)}
  .poster{
    position:absolute;left:980px;top:150px;width:360px;height:540px;border-radius:8px;
    background:linear-gradient(180deg,#4a3a2a,#22201a);box-shadow:0 30px 60px rgba(0,0,0,.55);
  }
  .cw{top:820px;width:auto}
  .cw h2{margin:0 0 12px;font:600 18px "Bricolage Grotesque",sans-serif}
  .row{display:flex;gap:16px}
  .row div{width:110px;height:165px;border-radius:8px;border:1px solid rgba(236,229,213,.14)}
  .row .a{background:linear-gradient(180deg,#3a342b,#1f1c16)}
  .row .b{background:linear-gradient(180deg,#42382c,#211d17)}
  .row .c{background:linear-gradient(180deg,#34302a,#1d1b16)}
  .sr{position:absolute;left:-9999px}
</style>
</head>
<body>
  <header class="wrap">
    <span class="logo">Pick Flick</span>
    <nav><a href="#">Search</a><a href="#">Watchlist</a><a href="#">History</a><span class="avatar"></span></nav>
  </header>

  <main class="wrap">
    <input type="text" placeholder="What's the vibe tonight?" aria-label="Mood">
    <div class="chips">
      <button class="chip on">Something light</button>
      <button class="chip">Slow burn</button>
      <button class="chip">Under 2 hours</button>
      <button class="chip">Surprise me</button>
    </div>
    <h1>Past Lives</h1>
    <p class="meta">2023 · 1h 46m · 7.8</p>
    <p class="reason">Quiet, Korean-language, and under two hours. You liked Drive My Car and it is past ten.</p>
    <div class="actions"><button class="btn play">Play</button><button class="btn">Not tonight</button></div>
    <div class="tools"><i></i><i></i><i></i></div>
  </main>

  <div class="poster" role="presentation"></div>

  <section class="wrap cw">
    <h2>Continue watching</h2>
    <div class="row">
      <div class="a" title="Severance S2 E4"></div>
      <div class="b" title="The Bear S3 E1"></div>
      <div class="c" title="Perfect Days"></div>
    </div>
  </section>
</body>
</html>
